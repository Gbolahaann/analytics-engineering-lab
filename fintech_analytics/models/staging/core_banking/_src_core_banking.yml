version: 2

sources:
  - name: core_banking
    schema: dbt_gadebayo
    tables:
      - name: raw_accounts
        columns:
          - name: acct_id
            description: primary identifier for accounts
            data_type: integer
            data_tests:
              - unique
              - not_null
          - name: cust_ref
            description: foreign key link to customers
            data_type: integer
            data_tests: 
              - relationships:
                  arguments: 
                  to: source('crm','raw_customers')
                  field: cust_id
          - name: acct_type
            data_type: text
          - name: opened_dt
            data_type: date
          - name: acct_status
            data_type: text
          - name: currency_cd
            data_type: text
            
      - name: raw_transactions
        freshness:
          warn_after:
            count: 1
            period: hour
          error_after:
            count: 12
            period: hour
        loaded_at_field: _loaded_at
        columns:
          - name: txn_id
            description: primary identifier for transactions table
            data_type: integer
            data_tests:
              - unique
              - not_null
          - name: acct_no
            data_type: integer
          - name: txn_amt_pence
            data_type: integer
          - name: txn_ccy
            data_type: text
          - name: txn_type
            data_type: text
          - name: txn_ts
            data_type: timestamp without time zone
          - name: merchant_nm
            data_type: text
          - name: mcc_code
            data_type: integer
          - name: _loaded_at
            data_type: timestamp without time zone
